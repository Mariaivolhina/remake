<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Robots - Product Pages</title>
<link rel="icon" type="image/png" sizes="32x32" href="go2/assets/favicon/favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --card: #121212; --line: #282828; --text: #fff; --muted: #cbcbcb; --blue: #6289ff; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: "Work Sans", sans-serif;
         display: grid; place-content: center; gap: 32px; padding: 48px 16px; }
  header { text-align: center; display: grid; gap: 12px; justify-items: center; }
  header img { width: 200px; height: auto; }
  header p { color: var(--muted); }
  .sites { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; width: min(840px, 100%); }
  a.site { display: grid; gap: 12px; padding: 16px; border-radius: 16px; background: var(--card);
           border: 1px solid var(--line); color: inherit; text-decoration: none; transition: border-color .15s; }
  a.site:hover, a.site:focus-visible { border-color: var(--blue); outline: none; }
  a.site img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 10px; background: #0a0a0a; }
  a.site strong { font-size: 20px; font-weight: 500; }
  a.site span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <header>
    <img src="go2/assets/logos/ai_robots_logo.svg" alt="AI Robots" width="211" height="26">
    <p>Product pages</p>
  </header>
  <div class="sites">
    <a class="site" href="go2/">
      <img src="go2/assets/img/poster_3.png" alt="">
      <strong>Unitree Go2</strong>
      <span>Quadruped robot</span>
    </a>
    <a class="site" href="mower/">
      <img src="mower/assets/mower/hero.jpg" alt="">
      <strong>Crawler Lawn Mower</strong>
      <span>Remote-controlled tracked mower</span>
    </a>
  </div>
</body>
</html>
